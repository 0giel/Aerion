[package]
name = "launcher-core"
description = "Minecraft launcher engine: downloads, Java, auth, instances, loaders, mod providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Derive `specta::Type` on IPC-visible types (enabled by the Tauri layer).
specta = ["dep:specta"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta = { workspace = true, optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1"
tar = "0.4"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"
base64 = "0.23"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
directories = "6"
keyring = "4.2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
mslnk = "0.1"
dunce = "1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
