[workspace]
resolver = "3"
members = ["crates/launcher-core", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "json", "stream", "query", "form", "multipart", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }

[profile.dev.package."*"]
# Hashing, zip and TLS are painfully slow unoptimised; dependencies rarely change.
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
