# A launcher release: push a tag like v1.0.1 (the version in src-tauri/tauri.conf.json).
# GitHub builds Linux (.deb, AppImage) and Windows (installer), signs the updates and opens a
# DRAFT release with latest.json. Check it and press "Publish": installed launchers update then.
# Settings → Secrets and variables → Actions: secret TAURI_SIGNING_PRIVATE_KEY (contents of
# updater.key), secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD only if the key has a password, and
# LAUNCHER_MSA_CLIENT_ID as a variable or a secret.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but tauri.conf.json says $version"; exit 1; }

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Microsoft sign-in needs this identifier inside the build. A release made without it can't
      # log anyone in (1.0.0 shipped like that), so an empty value stops the build right here.
      - name: The Microsoft client ID is set
        shell: bash
        run: |
          if [ -z "${LAUNCHER_MSA_CLIENT_ID// /}" ]; then
            echo "::error::LAUNCHER_MSA_CLIENT_ID is empty: add it under Settings > Secrets and variables > Actions (a repository variable or a secret)."
            exit 1
          fi
          echo "client ID present (${#LAUNCHER_MSA_CLIENT_ID} characters)"
        env:
          LAUNCHER_MSA_CLIENT_ID: ${{ vars.LAUNCHER_MSA_CLIENT_ID || secrets.LAUNCHER_MSA_CLIENT_ID }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # An identifier, not a secret: a repository variable or a secret both work.
          LAUNCHER_MSA_CLIENT_ID: ${{ vars.LAUNCHER_MSA_CLIENT_ID || secrets.LAUNCHER_MSA_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aerion __VERSION__
          releaseBody: "What's new: see the launcher's changelog. / Co nowego: lista zmian w launcherze."
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}
      # AerionSetup.exe, the small window that downloads and installs the newest version. It sits
      # next to the regular files; if this fails the release still works (the site then offers the
      # regular installer), so check the draft has the file before publishing.
      - name: Build AerionSetup.exe
        if: runner.os == 'Windows'
        continue-on-error: true
        id: setup
        shell: bash
        working-directory: installer
        run: cargo build --release
      - name: Attach AerionSetup.exe to the draft
        if: runner.os == 'Windows' && steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" installer/target/release/AerionSetup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The finished program must contain the identifier; otherwise this job fails and the draft
      # release must not be published.
      - name: The build contains the client ID
        shell: bash
        run: |
          bin=target/release/aerion
          [ -f "$bin.exe" ] && bin="$bin.exe"
          if ! grep -a -q -F "$LAUNCHER_MSA_CLIENT_ID" "$bin"; then
            echo "::error::$bin was built without the Microsoft client ID. Do NOT publish this draft."
            exit 1
          fi
          echo "client ID found in $bin"
        env:
          LAUNCHER_MSA_CLIENT_ID: ${{ vars.LAUNCHER_MSA_CLIENT_ID || secrets.LAUNCHER_MSA_CLIENT_ID }}
