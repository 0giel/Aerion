// Minecraft 1.21.x is obfuscated: compile against Mojang's names and remap the jar.
plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	// Aerion Screens: compiled against, and carried inside this jar (Fabric loads it as its own mod;
	// a copy the player put in mods/ is used instead).
	implementation project(path: ':screens_v1_21_11', configuration: 'namedElements')
	include project(':screens_v1_21_11')
}

tasks.withType(JavaCompile).configureEach {
	// The shared code is compiled for 1.21.11's Java 21 too.
	it.options.release = 21
}
