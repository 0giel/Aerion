// Aerion mod: the launcher's theme, HUD modules and client features. Client only and without
// Fabric API, so it works next to any mod list. scripts/build-mod.sh copies the jars into the
// launcher, which loads the one matching the instance's Minecraft version.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
	version = rootProject.version
	group = rootProject.group

	afterEvaluate {
		boolean server = project.name.startsWith('server_')
		// The messages of shared windows and the relay that passes them on: the same classes in the
		// server mod and in the mod (a world hosted from the game passes windows on by itself).
		sourceSets.main.java.srcDir rootProject.file('net/src/main/java')
		sourceSets.main.resources.srcDir rootProject.file('net/src/main/resources')
		sourceSets.main.java.srcDir rootProject.file('server/src/main/java')
		if (server) {
			sourceSets.main.resources.srcDir rootProject.file('server/src/main/resources')
			base.archivesName = "aerion-screens-server-${project.minecraft_version}"
		} else {
			// Shared sources and assets (theme, HUD, features) next to the version's own code.
			sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
			sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
			base.archivesName = "aerion-ui-${project.minecraft_version}"
		}

		processResources {
			def props = [version: project.version, minecraft: project.minecraft_range]
			inputs.properties props
			filesMatching('fabric.mod.json') { expand props }
		}
	}
}
