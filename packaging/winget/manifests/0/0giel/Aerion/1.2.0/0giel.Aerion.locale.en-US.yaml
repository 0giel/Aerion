ShortDescription: A fast, themeable launcher for Minecraft Java Edition with its own HUD mod.
Description: |-
  Aerion is an unofficial launcher for Minecraft: Java Edition. It installs Fabric, Quilt, Forge and NeoForge,
  finds mods on Modrinth and CurseForge, and comes with its own mod: a HUD arranged with the mouse and menus in
  the launcher's theme. Not approved by or associated with Mojang or Microsoft.
