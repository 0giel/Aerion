# AerionSetup.exe: a small window that downloads the newest Aerion, checks its signature, runs the
# regular installer silently and starts the launcher. A crate of its own: it is built for Windows
# only and has nothing to do with the launcher's build.
[package]
name = "aerion-setup"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[[bin]]
name = "AerionSetup"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
minisign-verify = "0.2"
serde_json = "1"
ureq = "2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
png = "0.17"
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
